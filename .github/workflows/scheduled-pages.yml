name: Scheduled Pages Publish

# Full site (main) is live from 4pm to midnight Sydney time; the
# Cocktail Hour tab is suppressed (cocktail-hour-suppressed) from
# midnight to 4pm.
#
# Runs every 15 minutes and, on every run, works out which variant
# should currently be live and (re)deploys it - it does not try to
# match a specific trigger moment. That means a delayed or skipped
# cron run (GitHub's schedule can lag, especially under load) just
# self-corrects on the next tick at most 15 minutes later, instead of
# silently missing the whole day. It also uses the actual Sydney
# wall-clock time at runtime rather than fixed UTC cron slots, so it
# stays correct across the AEST/AEDT daylight-saving switch.
#
# Requires: repo Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions" (one-time, must be set manually).
#
# The cron below is offset to :07/:22/:37/:52 rather than the round
# marks (:00/:15/:30/:45). GitHub's scheduler is shared across every
# repo on the platform, and jobs pinned to round marks queue behind a
# huge spike of everyone else's cron jobs firing at the same instant -
# GitHub's own docs warn this can delay a run well past its due time.
# An off-beat minute avoids that pileup.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Force a variant to deploy now (leave blank to use the current-time check)'
        required: false
        type: choice
        options:
          - ''
          - full
          - suppressed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: variant
        env:
          FORCED_VARIANT: ${{ github.event.inputs.variant }}
        run: |
          if [ -n "$FORCED_VARIANT" ]; then
            echo "variant=$FORCED_VARIANT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=Australia/Sydney date +%-H)

          if [ "$hour" -ge 16 ]; then
            echo "variant=full" >> "$GITHUB_OUTPUT"
          else
            echo "variant=suppressed" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout full version
        if: steps.variant.outputs.variant == 'full'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout suppressed version
        if: steps.variant.outputs.variant == 'suppressed'
        uses: actions/checkout@v7
        with:
          ref: cocktail-hour-suppressed

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
