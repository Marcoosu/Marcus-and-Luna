name: Scheduled Pages Publish

# Reveals the full site (main) at 4pm Sydney time and suppresses the
# Cocktail Hour tab (cocktail-hour-suppressed) at midnight, every day.
#
# Runs every 15 minutes and checks the actual Sydney wall-clock time at
# runtime, rather than pinning fixed UTC cron slots, so it stays correct
# across the AEST/AEDT daylight-saving switch without any manual edits.
#
# Requires: repo Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions" (one-time, must be set manually).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Force a variant to deploy now (leave blank to use the scheduled time check)'
        required: false
        type: choice
        options:
          - ''
          - full
          - suppressed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      variant: ${{ steps.check.outputs.variant }}
    steps:
      - id: check
        env:
          FORCED_VARIANT: ${{ github.event.inputs.variant }}
        run: |
          if [ -n "$FORCED_VARIANT" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "variant=$FORCED_VARIANT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=Australia/Sydney date +%-H)
          minute=$(TZ=Australia/Sydney date +%-M)

          if [ "$hour" = "16" ] && [ "$minute" -lt 15 ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "variant=full" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "0" ] && [ "$minute" -lt 15 ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "variant=suppressed" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "variant=" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-time
    if: needs.check-time.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout full version
        if: needs.check-time.outputs.variant == 'full'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout suppressed version
        if: needs.check-time.outputs.variant == 'suppressed'
        uses: actions/checkout@v7
        with:
          ref: cocktail-hour-suppressed

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
