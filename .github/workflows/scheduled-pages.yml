name: Scheduled Pages Publish

# Full site (main) is live from 4pm to midnight Sydney time; the
# Cocktail Hour tab is suppressed (cocktail-hour-suppressed) from
# midnight to 4pm. The prizes-claimed variant (cocktail-hour-prizes-claimed)
# is only ever deployed by explicitly picking it below.
#
# Manual trigger only (workflow_dispatch). Pick which variant to deploy;
# if this workflow is ever triggered without a variant (e.g. via the
# API), it falls back to working out which variant should currently be
# live using the actual Sydney wall-clock time at runtime.
#
# Requires: repo Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions" (one-time, must be set manually).

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to deploy'
        required: true
        type: choice
        options:
          - suppressed
          - full
          - prizes-claimed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: variant
        env:
          FORCED_VARIANT: ${{ github.event.inputs.variant }}
        run: |
          if [ -n "$FORCED_VARIANT" ]; then
            echo "variant=$FORCED_VARIANT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=Australia/Sydney date +%-H)

          if [ "$hour" -ge 16 ]; then
            echo "variant=full" >> "$GITHUB_OUTPUT"
          else
            echo "variant=suppressed" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout full version
        if: steps.variant.outputs.variant == 'full'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout suppressed version
        if: steps.variant.outputs.variant == 'suppressed'
        uses: actions/checkout@v7
        with:
          ref: cocktail-hour-suppressed

      - name: Checkout prizes-claimed version
        if: steps.variant.outputs.variant == 'prizes-claimed'
        uses: actions/checkout@v7
        with:
          ref: cocktail-hour-prizes-claimed

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
