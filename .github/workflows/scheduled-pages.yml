name: Scheduled Pages Publish

# Full site (main), Cocktail Hour suppressed (cocktail-hour-suppressed),
# and prizes-claimed (cocktail-hour-prizes-claimed) variants, deployed
# by explicitly picking one below.
#
# Manual trigger only (workflow_dispatch).
#
# Requires: repo Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions" (one-time, must be set manually).

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to deploy'
        required: true
        type: choice
        default: suppressed
        options:
          - suppressed
          - full
          - prizes-claimed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: variant
        run: echo "variant=${{ github.event.inputs.variant }}" >> "$GITHUB_OUTPUT"

      - name: Checkout full version
        if: steps.variant.outputs.variant == 'full'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout suppressed version
        if: steps.variant.outputs.variant == 'suppressed'
        uses: actions/checkout@v7
        with:
          ref: cocktail-hour-suppressed

      - name: Checkout prizes-claimed version
        if: steps.variant.outputs.variant == 'prizes-claimed'
        uses: actions/checkout@v7
        with:
          ref: cocktail-hour-prizes-claimed

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
